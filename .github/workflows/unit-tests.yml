name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  checks: write
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR or synthetic merge commit
        uses: actions/checkout@v4

      - name: Allow another PR to join the queue
        if: github.event_name == 'merge_group'
        run: sleep 60

      - name: Run unit tests
        run: bash scripts/queue-unit-tests.sh

      - name: Publish Piper and Component Tests bypasses
        if: always() && github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          publish_bypass() {
            local name="$1"
            gh api -X POST "repos/${{ github.repository }}/check-runs" \
              -f name="${name}" \
              -f head_sha="${HEAD_SHA}" \
              -f status="completed" \
              -f conclusion="success" \
              -f "output[title]=${name} bypassed in merge queue" \
              -f "output[summary]=This validation passed on the pull request and is not rerun for the synthetic merge commit."
          }

          publish_bypass "Piper"
          publish_bypass "Component Tests"

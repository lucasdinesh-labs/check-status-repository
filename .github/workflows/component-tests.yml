name: Component Tests Runner

on:
  workflow_run:
    workflows: [Piper]
    types: [completed]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  update-component-tests-check:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Update Component Tests check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
            echo "No associated pull request. Nothing to do."
            exit 0
          fi

          LABELS=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '[.labels[].name]')
          if printf '%s' "${LABELS}" | python3 -c '
          import json
          import sys
          labels = json.load(sys.stdin)
          sys.exit(0 if any(label.upper() == "SKIP COMPONENT TESTS" for label in labels) else 1)
          '; then
            echo "SKIP COMPONENT TESTS is present. Leaving the prior check unchanged."
            exit 0
          fi

          CHECK_RUN_ID=""
          for attempt in {1..12}; do
            CHECK_RUN_ID=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs?check_name=Component+Tests&per_page=10" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.id) | last | .id // empty')
            if [[ -n "${CHECK_RUN_ID}" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "${CHECK_RUN_ID}" ]]; then
            echo "::error::No seeded Component Tests check was found for ${HEAD_SHA}."
            exit 1
          fi

          gh api -X PATCH "repos/${{ github.repository }}/check-runs/${CHECK_RUN_ID}" \
            -f status="completed" \
            -f conclusion="success" \
            -f "output[title]=Component tests passed" \
            -f "output[summary]=POC baseline run completed successfully."

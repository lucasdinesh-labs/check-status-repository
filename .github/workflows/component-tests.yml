name: Component Tests

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
      image_version:
        required: true
        type: string
      pr_number:
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Determine Component Tests execution
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          LABELS=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '[.labels[].name]')
          if ! printf '%s' "${LABELS}" | python3 -c '
          import json
          import sys
          labels = json.load(sys.stdin)
          sys.exit(0 if any(label.upper() == "SKIP COMPONENT TESTS" for label in labels) else 1)
          '; then
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          PREVIOUS_SHA=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}" --jq '.parents[0].sha // empty')
          PREVIOUS_CONCLUSION=""
          if [[ -n "${PREVIOUS_SHA}" ]]; then
            PREVIOUS_CONCLUSION=$(gh api "repos/${{ github.repository }}/commits/${PREVIOUS_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions" and .name == "CI / piper / component-tests / Component Tests") | sort_by(.id) | last | .conclusion // empty] | first')
          fi

          if [[ "${PREVIOUS_CONCLUSION}" == "success" ]]; then
            echo "::notice::Component Tests skipped. Success inherited from ${PREVIOUS_SHA:0:7}."
          else
            echo "::notice::Component Tests skipped. The preceding Component Tests check was not successful."
          fi
          echo "skip=true" >> "${GITHUB_OUTPUT}"

      - name: Simulate Component Tests
        if: steps.prepare.outputs.skip != 'true'
        run: echo "Component tests passed for image ${{ inputs.image_version }}"

      - name: Report skipped Component Tests
        if: steps.prepare.outputs.skip == 'true'
        run: echo "Component tests skipped by label."

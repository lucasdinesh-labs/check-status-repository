name: Component Tests Runner

on:
  workflow_run:
    workflows: [Piper]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

jobs:
  update-component-tests-check:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Update Component Tests check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
            echo "No associated pull request. Nothing to do."
            exit 0
          fi

          find_native_check_run() {
            local check_suite_id
            for attempt in {1..12}; do
              check_suite_id=$(gh api \
                "repos/${{ github.repository }}/actions/workflows/component-tests-status.yml/runs?head_sha=${HEAD_SHA}&per_page=100" \
                --jq '[.workflow_runs[] | select(.event == "pull_request") | .check_suite_id] | max // empty' \
                2>/dev/null || true)
              if [[ -n "${check_suite_id}" && "${check_suite_id}" != "null" ]]; then
                CHECK_RUN_ID=$(gh api \
                  "repos/${{ github.repository }}/check-suites/${check_suite_id}/check-runs?per_page=100" \
                  --jq '[.check_runs[] | select(.name == "Component Tests" and .app.slug == "github-actions")] | .[0].id // empty' \
                  2>/dev/null || true)
                if [[ -n "${CHECK_RUN_ID}" && "${CHECK_RUN_ID}" != "null" ]]; then
                  return
                fi
              fi
              sleep 5
            done
            echo "::error::Could not find the native Component Tests check in the status workflow suite."
            exit 1
          }

          patch_check() {
            local conclusion="$1" title="$2" summary="$3"
            gh api -X PATCH "repos/${{ github.repository }}/check-runs/${CHECK_RUN_ID}" \
              -f status="completed" \
              -f conclusion="${conclusion}" \
              -f "output[title]=${title}" \
              -f "output[summary]=${summary}"
          }

          find_last_real_component_test() {
            local -a commits
            local sha check summary conclusion source_sha source_url
            local marker='<!-- component-tests-real-run: sha=([^[:space:]]+) url=([^[:space:]]+) -->'

            mapfile -t commits < <(gh api \
              "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits?per_page=100" \
              --paginate --jq '.[].sha')

            for ((index=${#commits[@]} - 1; index >= 0; index--)); do
              sha="${commits[index]}"
              [[ "${sha}" == "${HEAD_SHA}" ]] && continue
              check=$(gh api \
                "repos/${{ github.repository }}/commits/${sha}/check-runs?check_name=Component+Tests&per_page=100" \
                --jq '[.check_runs[] | select(.app.slug == "github-actions" and .name == "Component Tests" and .status == "completed") | {id, conclusion, summary: (.output.summary // "")} ] | sort_by(.id) | last // empty' \
                2>/dev/null || true)
              [[ -z "${check}" ]] && continue

              summary=$(jq -r '.summary' <<<"${check}")
              if [[ "${summary}" =~ ${marker} ]]; then
                conclusion=$(jq -r '.conclusion' <<<"${check}")
                source_sha="${BASH_REMATCH[1]}"
                source_url="${BASH_REMATCH[2]}"
                if [[ "${conclusion}" == "success" ]]; then
                  printf '%s\t%s\n' "${source_sha}" "${source_url}"
                  return 0
                fi
                return 2
              fi
            done
            return 1
          }

          find_native_check_run

          LABELS=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '[.labels[].name]')
          if printf '%s' "${LABELS}" | python3 -c '
          import json
          import sys
          labels = json.load(sys.stdin)
          sys.exit(0 if any(label.upper() == "SKIP COMPONENT TESTS" for label in labels) else 1)
          '; then
            PROVENANCE=""
            if PROVENANCE=$(find_last_real_component_test); then
              IFS=$'\t' read -r SOURCE_SHA SOURCE_RUN_URL <<<"${PROVENANCE}"
              SUMMARY=$'SKIP COMPONENT TESTS is present.\n\n'
              SUMMARY+="Component tests last passed for commit \`${SOURCE_SHA:0:7}\`."
              SUMMARY+=$'\n\n'
              SUMMARY+="[Open the successful Component Tests run](${SOURCE_RUN_URL})"
              patch_check "success" "Component tests skipped, reusing ${SOURCE_SHA:0:7}" "${SUMMARY}"
            else
              SEARCH_STATUS=$?
              if [[ "${SEARCH_STATUS}" == "2" ]]; then
                patch_check "skipped" "Component tests skipped after a failed real run" \
                  "SKIP COMPONENT TESTS is present, but the latest real Component Tests run did not pass."
              else
                patch_check "skipped" "Component tests skipped without a prior successful run" \
                  "SKIP COMPONENT TESTS is present, but no prior successful Component Tests run was found in this PR."
              fi
            fi
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SUMMARY=$'POC baseline run completed successfully.\n\n'
          SUMMARY+="[Open the Component Tests run](${RUN_URL})"
          SUMMARY+=$'\n\n<!-- component-tests-real-run: sha='"${HEAD_SHA}"$' url='"${RUN_URL}"$' -->'

          patch_check "success" "Component tests passed" "${SUMMARY}"
